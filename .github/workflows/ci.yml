name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · lint · format · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  db:
    name: database (pgTAP + concurrency)
    # Pinned: the runner image's Postgres major must match the postgresql-16-* packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Plain Postgres 16 + pgTAP with a Supabase stub (supabase/tests/ci): no Docker, no secrets,
      # never touches a Supabase project.
      - name: Start Postgres 16 with pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-pgtap
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser "$USER"
      - run: supabase/tests/run-db-tests.sh

  e2e:
    name: storefront e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @valzaya/storefront exec playwright install --with-deps chromium
      # Uses the in-memory waitlist backend (see playwright.config.ts): no secrets needed.
      - run: pnpm --filter @valzaya/storefront test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/storefront/playwright-report
            apps/storefront/test-results
          retention-days: 7
